<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Mini Discord</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #36393f; color: #dcddde; overflow: hidden; }
        
        /* Barre des serveurs (tout à gauche) */
        .servers { width: 72px; background-color: #202225; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
        .server-icon { width: 48px; height: 48px; background-color: #36393f; border-radius: 50%; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .server-icon:hover { border-radius: 15px; background-color: #5865F2; color: white; }
        
        /* Barre des salons (à gauche) */
        .channels { width: 240px; background-color: #2f3136; display: flex; flex-direction: column; }
        .channels-header { padding: 15px; font-weight: bold; border-bottom: 1px solid #202225; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .channel-list { padding: 10px; flex-grow: 1; }
        .channel-item { padding: 8px; margin-bottom: 2px; border-radius: 4px; cursor: pointer; color: #8e9297; }
        .channel-item:hover, .channel-item.active { background-color: #393c43; color: white; }
        
        /* Zone de chat (au centre) */
        .chat { flex-grow: 1; display: flex; flex-direction: column; background-color: #36393f; }
        .chat-header { padding: 15px; border-bottom: 1px solid #202225; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 15px; }
        .avatar { width: 40px; height: 40px; background-color: #5865F2; border-radius: 50%; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-author { font-weight: bold; color: white; margin-bottom: 4px; }
        
        /* Zone de saisie */
        .input-area { padding: 0 20px 20px 20px; }
        #form { display: flex; background-color: #40444b; border-radius: 8px; padding: 10px; }
        #input { flex-grow: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; }
    </style>
</head>
<body>

    <!-- Barre des serveurs -->
    <div class="servers">
        <div class="server-icon" style="background-color: #5865F2; color: white;">M</div>
        <div class="server-icon">+</div>
    </div>

    <!-- Barre des salons -->
    <div class="channels">
        <div class="channels-header">Mon Serveur</div>
        <div class="channel-list">
            <div class="channel-item active"># général</div>
            <div class="channel-item"># annonces</div>
        </div>
    </div>

    <!-- Zone de discussion -->
    <div class="chat">
        <div class="chat-header"># général</div>
        <div id="messages">
            <!-- Les messages apparaîtront ici -->
        </div>
        <div class="input-area">
            <form id="form" action="">
                <input id="input" autocomplete="off" placeholder="Envoyer un message dans #général" />
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // On demande un pseudo à l'utilisateur quand il ouvre l'application
        let pseudo = prompt("Choisissez votre pseudo :") || "Anonyme";

        var socket = io();
        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value) {
                // On envoie un objet contenant le pseudo et le message
                socket.emit('chat message', { author: pseudo, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat message', function(msg) {
            // Création de l'affichage du message façon Discord
            var msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `
                <div class="avatar"></div>
                <div class="msg-content">
                    <span class="msg-author">${msg.author}</span>
                    <span>${msg.text}</span>
                </div>
            `;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
