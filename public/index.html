<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Aurora Chat</title>
    <style>
        :root {
            --bg-tertiary: #1e1f22; --bg-secondary: #2b2d31; --bg-primary: #313338;
            --bg-message-hover: #2e3035; --bg-modifier-hover: #35373c;
            --text-normal: #dbdee1; --text-muted: #80848e; --brand-experiment: #5865F2;
            --red-danger: #da373c; --profile-card: #232428;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: var(--bg-primary); color: var(--text-normal); overflow: hidden; }
        
        /* LOGIN */
        #login-screen { position: absolute; inset: 0; background-color: var(--bg-primary); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background-color: var(--bg-secondary); padding: 32px; border-radius: 8px; width: 400px; text-align: center; }
        .login-box h2 { color: white; margin: 0 0 8px 0; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: none; background-color: var(--bg-tertiary); color: white; outline: none; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background-color: var(--brand-experiment); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #login-error { color: var(--red-danger); font-size: 13px; margin-bottom: 10px; display: none; }

        /* UI PRINCIPALE */
        .servers { width: 72px; background-color: var(--bg-tertiary); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; z-index: 10; }
        .server-icon { width: 48px; height: 48px; background-color: var(--bg-primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-weight: bold; }
        .server-icon.active { border-radius: 16px; background-color: var(--brand-experiment); }
        .server-separator { width: 32px; height: 2px; background-color: var(--bg-modifier-hover); }

        .sidebar { width: 240px; background-color: var(--bg-secondary); display: flex; flex-direction: column; }
        .channel-list { padding: 10px; flex-grow: 1; overflow-y: auto; }
        .channel-category { color: var(--text-muted); font-size: 12px; font-weight: bold; text-transform: uppercase; margin: 15px 0 5px 5px; }
        .channel-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 10px; margin-bottom: 2px;}
        .channel-item:hover, .channel-item.active { background-color: var(--bg-modifier-hover); color: white; }
        .channel-avatar { width: 32px; height: 32px; border-radius: 50%; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;}

        /* PANNEAU UTILISATEUR */
        .user-panel { background-color: #232428; padding: 0 8px; height: 52px; display: flex; align-items: center; gap: 8px; }
        .user-panel-avatar { width: 32px; height: 32px; border-radius: 50%; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;}
        .user-info { flex-grow: 1; overflow: hidden; }
        .user-info .username { color: white; font-weight: bold; font-size: 14px; }
        .btn-icon { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 5px; }

        /* CHAT */
        .chat { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-primary); }
        .chat-header { height: 48px; padding: 0 16px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; font-weight: bold; color: white; gap: 10px; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 16px 0; }
        .message { display: flex; gap: 16px; padding: 2px 16px 2px 72px; position: relative; margin-top: 17px; }
        .message:hover { background-color: var(--bg-message-hover); }
        .msg-avatar { position: absolute; left: 16px; width: 40px; height: 40px; border-radius: 50%; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;}
        .msg-content { display: flex; flex-direction: column; }
        .msg-header { display: flex; gap: 8px; margin-bottom: 4px; align-items: baseline;}
        .msg-author { font-weight: 500; color: white; font-size: 16px; }
        .msg-time { color: var(--text-muted); font-size: 12px; }
        .msg-text { color: var(--text-normal); font-size: 15px; }

        .input-area { padding: 0 16px 24px 16px; }
        .input-wrapper { display: flex; align-items: center; background-color: #383a40; border-radius: 8px; padding: 0 16px; min-height: 44px; }
        #input { flex-grow: 1; background: transparent; border: none; color: white; outline: none; font-size: 16px; padding: 11px 0; }
        
        /* PARAMÈTRES (CORRECTION DU BUG VISUEL) */
        #settings-screen { position: absolute; inset: 0; background-color: var(--bg-primary); display: none; z-index: 1000; }
        .settings-sidebar { width: 30%; background-color: var(--bg-secondary); display: flex; justify-content: flex-end; padding-top: 60px; }
        .settings-nav { width: 220px; padding: 0 20px; }
        .settings-item { padding: 8px 10px; color: #b5bac1; border-radius: 4px; cursor: pointer; margin-bottom: 2px;}
        .settings-item.active { background-color: var(--bg-modifier-hover); color: white; }
        
        .settings-content { width: 70%; padding: 60px 40px; overflow-y: auto; position: relative;}
        .close-settings { position: absolute; top: 40px; right: 40px; width: 36px; height: 36px; border: 2px solid var(--text-muted); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--text-muted); cursor: pointer; }

        .profile-card { background-color: var(--profile-card); border-radius: 8px; margin-bottom: 40px; }
        .profile-banner { height: 100px; background-color: #5865F2; border-radius: 8px 8px 0 0;}
        /* CORRECTION DU BUG ICI */
        .profile-header { padding: 16px; display: flex; justify-content: flex-end; position: relative; height: 35px;}
        .profile-avatar-large { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--profile-card); position: absolute; top: -50px; left: 16px; background-color: var(--bg-primary); background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; font-size: 40px; color: white; font-weight: bold; z-index: 10;}
        
        .profile-names { padding: 0 16px 20px 16px;}
        .btn-primary { background-color: var(--brand-experiment); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .info-list { background-color: var(--bg-primary); border-radius: 8px; padding: 16px; margin: 0 16px 16px 16px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-secondary { background-color: #4e5058; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Écran de connexion (Mot de passe ajouté) -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Te revoilà !</h2>
            <div id="login-error"></div>
            <input type="text" id="login-username" placeholder="Nom d'utilisateur" autocomplete="off" />
            <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="off" />
            <button id="login-btn">Se connecter / S'inscrire</button>
        </div>
    </div>

    <!-- UI Principale -->
    <div class="servers">
        <div class="server-icon active" onclick="switchRoom('general')">🌐</div>
        <div class="server-separator"></div>
    </div>

    <div class="sidebar">
        <div class="channel-list">
            <div class="channel-category">Général</div>
            <div class="channel-item active" id="btn-room-general" onclick="switchRoom('general')"># discussions</div>
            
            <div class="channel-category" style="margin-top: 25px;">Utilisateurs en ligne (MP)</div>
            <div id="online-users-list">
                <!-- Les amis apparaîtront ici -->
            </div>
        </div>
        
        <!-- Panneau Utilisateur -->
        <div class="user-panel">
            <div class="user-panel-avatar" id="nav-avatar"></div>
            <div class="user-info">
                <div class="username" id="nav-username">...</div>
                <div style="color: #23a559; font-size: 12px;">En ligne</div>
            </div>
            <button class="btn-icon" id="open-settings-btn" title="Paramètres">⚙️</button>
        </div>
    </div>

    <div class="chat">
        <div class="chat-header" id="chat-title">🌐 # discussions</div>
        <div id="messages"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <form id="form" action="" style="flex-grow: 1; display: flex;">
                    <input id="input" autocomplete="off" placeholder="Envoyer un message..." />
                </form>
            </div>
        </div>
    </div>

    <!-- PARAMÈTRES -->
    <div id="settings-screen">
        <div class="settings-sidebar">
            <div class="settings-nav">
                <div class="settings-item active">Mon compte</div>
                <div class="settings-item" id="logout-btn" style="color: var(--red-danger); margin-top: 20px;">Déconnexion</div>
            </div>
        </div>
        
        <div class="settings-content">
            <div class="close-settings" id="close-settings-btn">✕</div>
            <h2 style="color: white; margin-top:0;">Mon compte</h2>
            
            <div class="profile-card">
                <div class="profile-banner"></div>
                <div class="profile-header">
                    <div class="profile-avatar-large" id="settings-avatar"></div>
                    <button class="btn-primary" id="edit-avatar-btn">Modifier l'avatar</button>
                </div>
                <div class="profile-names">
                    <div style="color: white; font-size: 20px; font-weight: bold;" id="settings-display-name">...</div>
                    <div style="color: var(--text-muted);" id="settings-tag">...</div>
                </div>
                
                <div class="info-list">
                    <div class="info-row">
                        <div>
                            <div style="color: var(--text-muted); font-size: 12px; font-weight: bold;">NOM D'UTILISATEUR</div>
                            <div style="color: white;" id="info-username">...</div>
                        </div>
                        <button class="btn-secondary" onclick="alert('Cette version ne permet pas de changer le pseudo !')">Modifier</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var myUser = null;
        var currentRoom = 'general';

        function stringToColor(str) {
            let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${hash % 360}, 70%, 60%)`;
        }

        function setAvatar(element, name, url) {
            if (url) {
                element.style.backgroundImage = `url('${url}')`;
                element.style.backgroundColor = 'transparent';
                element.textContent = '';
            } else {
                element.style.backgroundImage = 'none';
                element.style.backgroundColor = stringToColor(name);
                element.textContent = name.charAt(0).toUpperCase();
            }
        }

        // --- CONNEXION ---
        document.getElementById('login-btn').addEventListener('click', () => {
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            if (u && p) {
                socket.emit('login', { username: u, password: p }, (res) => {
                    if (res.success) {
                        myUser = { username: u, ...res.userData };
                        document.getElementById('login-screen').style.display = 'none';
                        updateProfileUI();
                    } else {
                        const err = document.getElementById('login-error');
                        err.textContent = res.message;
                        err.style.display = 'block';
                    }
                });
            }
        });

        // --- LISTE DES UTILISATEURS (MP) ---
        socket.on('online users', (usersList) => {
            const listDiv = document.getElementById('online-users-list');
            listDiv.innerHTML = '';
            usersList.forEach(u => {
                if (u !== myUser.username) { // Ne pas s'afficher soi-même
                    let div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerHTML = `<div class="channel-avatar" style="background-color: ${stringToColor(u)}">${u.charAt(0).toUpperCase()}</div> ${u}`;
                    div.onclick = () => openDM(u);
                    listDiv.appendChild(div);
                }
            });
        });

        // --- GESTION DES SALONS (DMs) ---
        function openDM(targetUser) {
            // Crée un ID unique pour le salon (les deux noms triés par ordre alphabétique)
            const roomID = [myUser.username, targetUser].sort().join('_');
            switchRoom(roomID, targetUser);
        }

        function switchRoom(roomID, targetName = null) {
            currentRoom = roomID;
            document.getElementById('messages').innerHTML = ''; // Vide l'écran
            
            // UI : Change le titre
            if (roomID === 'general') {
                document.getElementById('chat-title').textContent = '🌐 # discussions';
            } else {
                document.getElementById('chat-title').textContent = `💬 MP avec ${targetName}`;
            }

            socket.emit('join room', roomID);
        }

        // --- MESSAGES ---
        document.getElementById('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('input');
            if (input.value) {
                socket.emit('chat message', { room: currentRoom, text: input.value });
                input.value = '';
            }
        });

        socket.on('chat history', (data) => {
            if (data.room === currentRoom) {
                document.getElementById('messages').innerHTML = '';
                data.history.forEach(displayMessage);
            }
        });

        socket.on('chat message', (data) => {
            if (data.room === currentRoom) displayMessage(data.message);
        });

        function displayMessage(msg) {
            var msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `
                <div class="msg-avatar"></div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span class="msg-author">${msg.author}</span>
                        <span class="msg-time">${msg.time}</span>
                    </div>
                    <span class="msg-text">${msg.text}</span>
                </div>
            `;
            setAvatar(msgDiv.querySelector('.msg-avatar'), msg.author, msg.avatar);
            document.getElementById('messages').appendChild(msgDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        // --- PARAMÈTRES ET PROFIL ---
        function updateProfileUI() {
            document.getElementById('nav-username').textContent = myUser.username;
            setAvatar(document.getElementById('nav-avatar'), myUser.username, myUser.avatar);
            
            document.getElementById('settings-display-name').textContent = myUser.username;
            document.getElementById('settings-tag').textContent = myUser.tag;
            document.getElementById('info-username').textContent = myUser.username;
            setAvatar(document.getElementById('settings-avatar'), myUser.username, myUser.avatar);
        }

        document.getElementById('open-settings-btn').onclick = () => document.getElementById('settings-screen').style.display = 'flex';
        document.getElementById('close-settings-btn').onclick = () => document.getElementById('settings-screen').style.display = 'none';
        
        document.getElementById('edit-avatar-btn').onclick = () => {
            const url = prompt("Entrez l'URL de votre nouvelle image :");
            if (url !== null) {
                myUser.avatar = url;
                socket.emit('update profile', { avatar: url });
                updateProfileUI();
            }
        };

        document.getElementById('logout-btn').onclick = () => location.reload();
    </script>
</body>
</html>
